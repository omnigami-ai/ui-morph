<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fennick · UI morph, one task · Fictional company example</title>
<style>
  html, body { margin: 0; height: 100%; background: #efe7da; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
<canvas id="c" width="1440" height="1440"></canvas>
<script src="kit.js"></script>
<script>
// UI morph, one task: the skill's grammar (one container that never cuts, its springs, the blur hand-offs, a cursor
// that drives every change, 120 BPM) told as one real job in Fennick's shop (a fictional sparkling-tea shop made for
// omnigami's examples, cast/fennick/): skip the next box. Every morph is what the click before it opens. A caption
// above the container says each step, in Fennick's headline face. Story and timings: STORY.md.
// Sections are labelled KEEP (the machinery: carry it over unchanged) and ADAPT (the product's words, pieces, times,
// colours and sounds). Every hard-coded time below is one of T's or a CUR arrival: change them together.
(() => {
  const { clamp, lerp, spring, track, loadFont, loadImage, roundRect, easeOutExpo } = window.kit;
  const W = 1440, H = 1440, CX = 720, FPS = 60, DURATION = 16;
  const canvas = document.getElementById('c');
  const g = canvas.getContext('2d', { willReadFrequently: true });
  const layer = document.createElement('canvas'); layer.width = W; layer.height = H;
  const L = layer.getContext('2d', { willReadFrequently: true });
  const F = (w) => (s) => `${w} ${s}px "DM Sans"`;
  const DISPLAY = (s) => `800 ${s}px "Fennick Display"`; // Bricolage Grotesque at the shop's headline width (84%)
  // ADAPT: the product's colours (Fennick's: cast/fennick/brand.md, app.css): ink and paper are the container's two
  // ends; the brand colour (yuzu) is the one accent, where the product uses it (here the toast's check)
  const INK = '#1D1A16', PAPER = '#FBF6EE', GREY = '#6E665C', DIM = '#A39A8C', SAND = '#F2EADC', YUZU = '#F7CC33';
  const rgbOf = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const A = { box: null, mark: null };
  const easeOut = (p) => 1 - (1 - p) ** 3;

  // ---------- ADAPT: the words (the film's own captions say what the product does for the viewer) ----------
  const DEFAULTS = {
    button: 'Your box', ask: 'Plans changed?', step1: 'Skip the next box.', step2: 'Pick a new date.',
    toast: 'Skipped. Next box ships 10 Dec.', promise: 'Skip, swap or pause any time.',
  };
  const FIELDS = [
    { id: 'button', type: 'text', label: 'Button', maxLength: 12, help: 'Opens the task and closes the loop.' },
    { id: 'ask', type: 'text', label: 'Caption 1', maxLength: 22 },
    { id: 'step1', type: 'text', label: 'Caption 2', maxLength: 22 },
    { id: 'step2', type: 'text', label: 'Caption 3', maxLength: 22 },
    { id: 'toast', type: 'text', label: 'Toast', maxLength: 34, help: 'The result.' },
    { id: 'promise', type: 'text', label: 'Closing line', maxLength: 30 },
  ];
  let V = DEFAULTS;
  // ADAPT: sample data, shown only inside the product's pieces (cast/fennick/app/data.js: order #10482, 12 cans every 4 weeks, next box ships
  // Thu 12 Nov; skipping it moves the next one to Thu 10 Dec)
  const CARD = { eyebrow: 'Next box ships', title: 'Thu 12 Nov', sub: '12 cans · every 4 weeks', skip: 'Skip a box', change: 'Change flavours' };
  const DATES = ['12 Nov', '10 Dec', '7 Jan'];

  // ---------- ADAPT: the story's times (s), on the 120 BPM grid ----------
  const T = {
    ask: 1.0,      // caption: Plans changed?
    open: 3.0,     // click Your box: it opens into the next box
    skip: 6.5,     // click Skip a box: the card becomes the date chooser
    pick: 9.0,     // click 10 Dec
    save: 9.62,    // the chooser collapses into the loader
    done: 10.0,    // the check (the song lands its hit here)
    toast: 10.4,   // the toast
    promise: 11.5, // caption: the shop's promise
    close: 13.5,   // the toast becomes the button again; the wordmark
  };
  const LAG = 0.08; // a morph starts this long after the click that opens it

  // ---------- the container: ADAPT the BOX rows; KEEP the group layout, the spring and logTrack ----------
  // the container's centre and the captions above it: caption, gap, container, centred as a group, so the
  // container keeps one centre and each caption sits a set gap above its own state's top edge
  const GROUP = 712, GAP = 104, CAPH = 53;
  const YB = Math.round(GROUP + (CAPH + GAP) / 2);
  const capY = (h) => YB - h / 2 - GAP - CAPH / 2;
  // [t, w, h, radius (null = pill), lum (0 ink … 1 paper), cx, cy]; the toast's width comes from its words
  const BOX = [
    [0, 540, 205, null, 0.03, CX, YB],               // 0 button
    [T.open + LAG, 1040, 560, 64, 0.03, CX, YB],     // 1 next-box card
    [T.skip + LAG, 1191, 169, null, 1, CX, YB],      // 2 date chooser
    [T.save, 221, 221, null, 0.03, CX, YB, [280, 27]], // 3 loader: a big collapse, so a firmer spring (it stays a circle)
    [T.done, 230, 230, null, 0.03, CX, YB],          // 4 check
    [T.toast, 'toast', 180, null, 0.03, CX, YB, [280, 25]], // 5 toast: a big growth, so a firmer spring (about 5% over)
    [T.close, 540, 205, null, 0.03, CX, YB],         // 6 button
  ];
  const K = [280, 19]; // the reference's container spring: a visible overshoot on every morph
  // width and height ride their springs in log space (a big change overshoots by a share of itself, not by pixels,
  // so a wide pill collapsing to a circle never passes through a tall one); a row can set its own spring
  function logTrack(t, keys) {
    let v = Math.log(keys[0][1]);
    for (let i = 1; i < keys.length; i++) v += (Math.log(keys[i][1]) - Math.log(keys[i - 1][1])) * spring(t - keys[i][0], ...(keys[i][2] || K));
    return Math.exp(v);
  }

  const SHAPES = { '1:1': { size: [1440, 1440], k: 1, box: {} } };
  let S;

  // ---------- the cursor (design px), its clicks: ADAPT CUR and CLICKS; KEEP the press, hover and ease ----------
  const START = [1268, 1150];
  // [arrival time, x, y, on]: on is the BOX row the point works on, 'frame' for its corner, null in passing
  const CUR = [
    [0, ...START, 'frame'], [2.0, ...START, 'frame'], [2.5, 838, 824, 0], [5.5, 838, 824, null],
    [6.0, 613, 986, 1], [8.0, 613, 986, null], [8.5, 790, 822, 2], [9.25, 790, 822, 2],
    [10.15, ...START, 'frame'], [DURATION, ...START, 'frame'],
  ];
  const CLICKS = [T.open, T.skip, T.pick];
  // a press: sinks over 0.05 s from just before the click, held, back over 0.16 s
  const env = (t, c) => easeOut(clamp((t - (c - 0.03)) / 0.05)) * (1 - easeOut(clamp((t - (c + 0.07)) / 0.16)));
  const hover = (t, arrive) => easeOut(clamp((t - arrive + 0.05) / 0.15));

  function cursorAt(t) {
    const C = S.cur;
    if (t <= C[0][0]) return [C[0][1], C[0][2]];
    for (let i = 1; i < C.length; i++) if (t <= C[i][0]) {
      const [ta, xa, ya] = C[i - 1], [tb, xb, yb] = C[i], p = (t - ta) / (tb - ta), e = 1 - (1 - p) ** 3.2;
      return [lerp(xa, xb, e), lerp(ya, yb, e)];
    }
    const e = C[C.length - 1]; return [e[1], e[2]];
  }

  // KEEP: each shape's layout (its boxes, the cursor's points and the springs' keys), cached per shape and toast
  const layouts = {};
  function layoutFor(size, toastText) {
    const key = size + '|' + toastText;
    if (layouts[key]) return layouts[key];
    const shape = SHAPES[size] || SHAPES['1:1'], [fw, fh] = shape.size, k = shape.k;
    g.font = F(500)(45);
    const toastW = Math.round(Math.max(720, 155 + g.measureText(toastText).width + 86));
    const boxes = BOX.map((b, i) => { const r = shape.box[i] ? [b[0], ...shape.box[i], ...b.slice(3)] : b.slice(); if (r[1] === 'toast') r[1] = toastW; return r; });
    const keys = (i) => boxes.map((b) => [b[0], b[i], b[7]]);
    const onX = (i, x) => boxes[i][5] + (x - BOX[i][5]) * boxes[i][1] / (BOX[i][1] === 'toast' ? toastW : BOX[i][1]);
    const onY = (i, y) => boxes[i][6] + (y - BOX[i][6]) * boxes[i][2] / BOX[i][2];
    const cur = CUR.map(([t, x, y, on]) => on === 'frame' ? [t, CX + (x - CX) * (fw / W) / k, 720 + (y - 720) * (fh / H) / k]
      : on == null ? [t, x, y] : [t, onX(on, x), onY(on, y)]);
    return (layouts[key] = {
      size: shape.size, k, ox: fw / 2 - CX * k, oy: fh / 2 - 720 * k, boxes, cur,
      KW: keys(1), KH: keys(2), KX: keys(5), KY: keys(6), KR: boxes.map((b) => [b[0], b[3] == null ? b[2] / 2 : b[3]]), lum: keys(4),
    });
  }

  // ---------- KEEP: the container at time t (ADAPT the first press and its hover: T.open, and 2.5, the cursor's arrival) ----------
  function box(t) {
    let w = logTrack(t, S.KW), h = logTrack(t, S.KH), r = track(t, S.KR, ...K);
    const cx = track(t, S.KX, ...K), cy = track(t, S.KY, ...K);
    // the button is the container: it lightens as the cursor rests on it, and sinks and lightens when pressed
    const p = env(t, T.open), hov = hover(t, 2.5) * (1 - clamp((t - T.open - LAG) / 0.12));
    const pk = 1 - 0.04 * p;
    w *= pk; h *= pk; r *= pk;
    r = Math.min(r, w / 2, h / 2);
    return { w, h, cx, cy, r, x: cx - w / 2, y: cy - h / 2, pk, lum: clamp(track(t, S.lum, 800, 57) + 0.025 * hov + 0.06 * p) };
  }

  // ---------- drawing helpers: KEEP textAt (centred on the capitals); ADAPT the icons and buttons to the product's ----------
  function textAt(c, s, x, y, font, size, colour, align = 'left') {
    c.font = font(size); c.fillStyle = colour; c.textAlign = align; window.kit.centreText(c, s, x, y);
    return c.measureText(s).width;
  }
  // the shop's own icons (cast/fennick/app/index.html), stroked as the shop strokes them
  const ICONS = {
    skip: new Path2D('M5 6.5l6 5.5-6 5.5M12 6.5l6 5.5-6 5.5'),
    swap: new Path2D('M5 8.5h13M14.5 5l3.5 3.5-3.5 3.5M19 15.5H6M9.5 12 6 15.5 9.5 19'),
  };
  function icon(c, name, x, y, s, colour) {
    c.save(); c.translate(x - s / 2, y - s / 2); c.scale(s / 24, s / 24);
    c.strokeStyle = colour; c.lineWidth = 1.75; c.lineCap = 'round'; c.lineJoin = 'round'; c.stroke(ICONS[name]); c.restore();
  }
  // a shop button (pill): icon and label centred; ghost = outlined, else filled paper on the ink card
  function shopButton(c, x, cy, w, h, label, name, ghost, hov, press) {
    const s = 1 - 0.04 * press;
    c.save(); c.translate(x + w / 2, cy); c.scale(s, s); c.translate(-(x + w / 2), -cy);
    roundRect(c, x, cy - h / 2, w, h, h / 2);
    if (ghost) {
      if (hov + press > 0) { c.fillStyle = `rgba(251,246,238,${0.08 * hov + 0.1 * press})`; c.fill(); }
      c.strokeStyle = PAPER; c.lineWidth = 3; roundRect(c, x + 1.5, cy - h / 2 + 1.5, w - 3, h - 3, h / 2 - 1.5); c.stroke();
    } else { c.fillStyle = PAPER; c.fill(); }
    const col = ghost ? PAPER : INK, is = 40, gap = 18;
    c.font = F(600)(38); const lw = c.measureText(label).width, x0 = x + w / 2 - (is + gap + lw) / 2;
    icon(c, name, x0 + is / 2, cy, is, col);
    textAt(c, label, x0 + is + gap, cy, F(600), 38, col);
    c.restore();
  }

  // ---------- ADAPT: content, one function per state, each the product's own piece; d is the state's own box, at the
  // container's centre. Their hovers and presses name the cursor's arrivals (6.0, 8.5) and T's clicks ----------
  const C = {};
  C.button = (c, b) => textAt(c, V.button, b.cx, b.cy, F(600), 55, PAPER, 'center');
  C.card = (c, b, age, t, d) => {
    const s = 250, tx = d.x + 60, ty = d.y + 60;
    roundRect(c, tx, ty, s, s, 48); c.fillStyle = SAND; c.fill();
    const ih = s * 0.82, iw = ih * A.box.width / A.box.height;
    c.drawImage(A.box, tx + s / 2 - iw / 2, ty + s * 0.1, iw, ih);
    const lx = tx + s + 48;
    textAt(c, CARD.eyebrow, lx, ty + 48, F(500), 38, DIM);
    textAt(c, CARD.title, lx, ty + 124, F(600), 64, PAPER);
    textAt(c, CARD.sub, lx, ty + 200, F(400), 38, DIM);
    const bh = 112, by = d.y + d.h - 60 - bh / 2, bw = (d.w - 120 - 24) / 2;
    shopButton(c, d.x + 60, by, bw, bh, CARD.skip, 'skip', true, hover(t, 6.0), env(t, T.skip));
    shopButton(c, d.x + 60 + bw + 24, by, bw, bh, CARD.change, 'swap', false, 0, 0);
  };
  // the date chooser: the shop's segmented control (ink on the chosen one); the next box sits on 12 Nov, the click
  // moves it to 10 Dec, its edges on different springs so it stretches as it travels; 12 Nov is struck through
  C.chooser = (c, b, age, t, d) => {
    const inset = 13, x0 = d.x + inset, x1 = d.x + d.w - inset, cy = d.cy, hh = d.h - 2 * inset, seg = (x1 - x0) / 3;
    const keys = [[0, 0], [T.pick, 1]];
    const left = track(t, keys.map(([tt, i]) => [tt, x0 + i * seg]), 170, 16), right = track(t, keys.map(([tt, i]) => [tt, x0 + (i + 1) * seg]), 440, 24);
    // the cursor rests on 10 Dec (a faint wash), then presses it
    const hov = hover(t, 8.5) * (1 - easeOut(clamp((t - T.pick - 0.12) / 0.16))), press = env(t, T.pick);
    if (hov > 0) {
      const s = 1 - 0.04 * press, mx = x0 + 1.5 * seg;
      c.save(); c.translate(mx, cy); c.scale(s, s); c.translate(-mx, -cy);
      roundRect(c, x0 + seg, cy - hh / 2, seg, hh, hh / 2); c.fillStyle = `rgba(29,26,22,${0.05 * hov + 0.06 * press})`; c.fill(); c.restore();
    }
    // 12 Nov: skipped, struck through as the indicator leaves it (drawn under the indicator, which covers it till then)
    const st = easeOut(clamp((t - T.pick - 0.1) / 0.2));
    const strike = () => { if (st <= 0) return; c.font = F(600)(47); const lw = c.measureText(DATES[0]).width, sx = x0 + 0.5 * seg - lw / 2 - 8;
      c.strokeStyle = GREY; c.lineWidth = 5; c.lineCap = 'round'; c.beginPath(); c.moveTo(sx, cy); c.lineTo(sx + (lw + 16) * st, cy); c.stroke(); };
    const labels = (colour) => DATES.forEach((s, i) => textAt(c, s, x0 + (i + 0.5) * seg, cy, F(600), 47, typeof colour === 'function' ? colour(i) : colour, 'center'));
    // the shop's dates are ink (cast/fennick/app .date); the skipped 12 Nov greys as it is struck, as the shop greys
    // a struck date (.plan-card dd s)
    const hex = (h) => [1, 3, 5].map((k) => parseInt(h.slice(k, k + 2), 16));
    const struck = `rgb(${hex(INK).map((v, k) => Math.round(v + (hex(GREY)[k] - v) * st)).join(',')})`;
    labels((i) => (i === 0 ? struck : INK)); strike();
    roundRect(c, left, cy - hh / 2, right - left, hh, hh / 2); c.fillStyle = INK; c.fill();
    c.save(); roundRect(c, left, cy - hh / 2, right - left, hh, hh / 2); c.clip(); labels(PAPER); c.restore();
  };
  C.loader = (c, b, age) => {
    const r = b.h * 0.2, a0 = age * 9.5, span = Math.PI * (1.15 + 0.35 * Math.sin(age * 7));
    c.strokeStyle = PAPER; c.lineWidth = b.h * 0.05; c.lineCap = 'round';
    c.beginPath(); c.arc(b.cx, b.cy, r, a0, a0 + span); c.stroke();
  };
  C.check = (c, b, age) => {
    const p = easeOutExpo(clamp((age - 0.04) / 0.2)), s = b.h;
    const pts = [[-0.16, 0.01], [-0.05, 0.12], [0.17, -0.12]].map(([x, y]) => [b.cx + x * s, b.cy + y * s]);
    const l1 = Math.hypot(pts[1][0] - pts[0][0], pts[1][1] - pts[0][1]), l2 = Math.hypot(pts[2][0] - pts[1][0], pts[2][1] - pts[1][1]);
    const d = p * (l1 + l2);
    c.strokeStyle = PAPER; c.lineWidth = s * 0.075; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(...pts[0]);
    const q = Math.min(1, d / l1); c.lineTo(lerp(pts[0][0], pts[1][0], q), lerp(pts[0][1], pts[1][1], q));
    if (d > l1) { const q2 = (d - l1) / l2; c.lineTo(lerp(pts[1][0], pts[2][0], q2), lerp(pts[1][1], pts[2][1], q2)); }
    c.stroke();
  };
  C.toast = (c, b, age, t, d) => {
    const r = 29, x = d.x + 90, p = easeOutExpo(clamp((age - 0.18) / 0.22));
    c.beginPath(); c.arc(x, d.cy, r, 0, Math.PI * 2); c.fillStyle = YUZU; c.fill();
    c.strokeStyle = INK; c.lineWidth = r * 0.28; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(x - r * 0.45, d.cy); c.lineTo(x - r * 0.45 + r * 0.3 * Math.min(1, p * 2), d.cy + r * 0.3 * Math.min(1, p * 2));
    if (p > 0.5) c.lineTo(x - r * 0.15 + r * 0.62 * (p - 0.5) * 2, d.cy + r * 0.3 - r * 0.72 * (p - 0.5) * 2);
    c.stroke();
    textAt(c, V.toast, x + r + 36, d.cy, F(500), 45, PAPER);
  };
  // [start, content, BOX row]
  const CONTENT = [[0, C.button, 0], [T.open + LAG, C.card, 1], [T.skip + LAG, C.chooser, 2], [T.save, C.loader, 3], [T.done, C.check, 4], [T.toast, C.toast, 5, 0.13], [T.close, C.button, 6]];
  // (the toast's words wait until the pill is nearly wide enough for them, so they never come into focus clipped)

  // ---------- captions: each step's words above the container, in the product's headline face (ADAPT CAPTIONS;
  // KEEP drawCaptions: a word at a time in, the line out at once, a set gap above its own state's top edge) ----------
  // [start, field (or 'mark' for the wordmark, null for none), the height of the state it goes with]
  const CAPTIONS = [[0, 'mark', 205], [T.ask, 'ask', 205], [T.open + LAG, 'step1', 560], [T.skip + LAG, 'step2', 169], [T.save, null, 0], [T.promise, 'promise', 180], [T.close, 'mark', 205]];
  const CAP_SIZE = 80, CAP_MAX = 1240;
  function drawCaptions(t, b) {
    for (let i = 0; i < CAPTIONS.length; i++) {
      const [start, key, h] = CAPTIONS[i], next = i + 1 < CAPTIONS.length ? CAPTIONS[i + 1][0] : Infinity;
      if (!key || t < start) continue;
      const q = clamp((t - next) / 0.14);
      if (q >= 1) continue;
      // a caption on its way out keeps its gap above the container's live top edge: the button opening into the tall
      // card pushes "Plans changed?" up as it leaves, instead of running over it
      const age = i === 0 ? 99 : t - start, y = q > 0 ? Math.min(capY(h), b.y - GAP - CAPH / 2) : capY(h);
      // each word rises a little and comes into focus, one after another; the line leaves blurring, all at once
      const word = (j) => { const p = clamp((age - 0.14 - j * 0.05) / 0.36), e = easeOut(p); return { a: e * (1 - easeOut(q)), dy: (1 - e) * 22 - q * 10, blur: (1 - e) * 10 + q * 8 }; };
      if (key === 'mark') {
        const s = word(0); if (s.a <= 0.003) continue;
        const mw = 420, mh = mw * A.mark.height / A.mark.width; // the letters' middle sits on the line (the seed rises above)
        g.save(); stage(g); g.globalAlpha = s.a; if (s.blur > 0.3) g.filter = `blur(${s.blur * S.k}px)`;
        g.drawImage(A.mark, CX - mw / 2, y + s.dy - mh * (85.8 / 120.8), mw, mh); g.restore();
        continue;
      }
      const words = String(V[key]).split(/\s+/).filter(Boolean);
      g.save(); stage(g); g.letterSpacing = `${-0.02 * CAP_SIZE}px`; g.font = DISPLAY(CAP_SIZE);
      let space = g.measureText(' ').width, ws = words.map((w) => g.measureText(w).width), total = ws.reduce((a, b) => a + b, 0) + space * (words.length - 1);
      let size = CAP_SIZE;
      if (total > CAP_MAX) { size = CAP_SIZE * CAP_MAX / total; g.letterSpacing = `${-0.02 * size}px`; g.font = DISPLAY(size); space = g.measureText(' ').width; ws = words.map((w) => g.measureText(w).width); total = ws.reduce((a, b) => a + b, 0) + space * (words.length - 1); }
      let x = CX - total / 2;
      g.fillStyle = INK; g.textAlign = 'left';
      words.forEach((w, j) => {
        const s = word(j);
        if (s.a > 0.003) {
          g.globalAlpha = s.a; g.filter = s.blur > 0.3 ? `blur(${s.blur * S.k}px)` : 'none';
          window.kit.centreText(g, w, x, y + s.dy);
        }
        x += ws[j] + space;
      });
      g.restore();
    }
  }

  // ---------- KEEP: drawing (ADAPT the ground's colour to the product's paper, a shade deeper) ----------
  let stage = (c) => c.setTransform(1, 0, 0, 1, 0, 0);
  function drawCursor(x, y, s) {
    g.save(); g.translate(x, y); g.scale(s, s);
    g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 46); g.lineTo(11, 35); g.lineTo(19, 53); g.lineTo(27, 49.5); g.lineTo(19, 32); g.lineTo(34, 32); g.closePath();
    g.shadowColor = 'rgba(0,0,0,0.3)'; g.shadowBlur = 10 * S.k; g.shadowOffsetY = 4 * S.k;
    g.lineJoin = 'round'; g.lineWidth = 5; g.strokeStyle = PAPER; g.stroke(); g.shadowColor = 'transparent';
    g.fillStyle = INK; g.fill(); g.restore();
  }
  function seek(t, values) {
    V = { ...DEFAULTS, ...values };
    S = layoutFor(V.size, V.toast);
    const [fw, fh] = S.size, k = S.k;
